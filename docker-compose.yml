name: sns-app

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sns}
      POSTGRES_USER: ${POSTGRES_USER:-sns}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sns}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sns} -d ${POSTGRES_DB:-sns}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3 の代わり（画像の保存先）。2026.03.0 以降は起動に LocalStack のアカウントと認証トークンが必要になったため、
  # トークンなしで動く最後の版 4.14.0 に固定する（docs/tech-stack.md）。
  # 無料版はデータを保存しないので、コンテナを作り直すと画像は消える（バケットは起動時のスクリプトで作り直される）
  localstack:
    image: localstack/localstack:4.14.0
    environment:
      SERVICES: s3
      S3_BUCKET: ${S3_BUCKET:-sns-app-images}
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # バケットを作るスクリプトまで終わったら「準備完了」
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
