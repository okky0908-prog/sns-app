spring:
  application:
    name: backend
  config:
    # ローカル開発ではリポジトリ直下の .env（docker-compose と共通）から DB・JWT の設定を読む。
    # 本番（AWS）では .env は置かず、環境変数で渡す
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sns}
    username: ${POSTGRES_USER:sns}
    password: ${POSTGRES_PASSWORD:sns}
  flyway:
    enabled: true
  servlet:
    multipart:
      # アイコンは5MBまで（超えたら項目ごとのエラーで返すため、ここでは少し大きめにしておく）。
      # 1回のリクエストは、画像投稿（5MB×4枚）に備えて大きめにする。これを超えると 413（PAYLOAD_TOO_LARGE）
      max-file-size: 10MB
      max-request-size: 25MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      # ALB のヘルスチェック用に /api/health で公開する（docs/infrastructure.md）
      base-path: /api
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # アクセストークン（JWT）。32バイト以上のランダムな文字列。ソースコードには書かず、.env または環境変数 JWT_SECRET で渡す
    secret: ${JWT_SECRET:}
    expiration: 15m
  refresh-token:
    expiration: 14d
    # Cookie の Secure 属性。HTTPS の本番では true にする（ローカル開発は HTTP なので false）
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    # 2つのタブが同時に再発行したときなどに、使い回しと誤判定してログアウトさせないための猶予時間
    reuse-grace: 10s
  # 画像の保存先（S3）。既定値はローカル開発の LocalStack（docker-compose）に合わせてある
  storage:
    bucket: ${S3_BUCKET:sns-app-images}
    region: ${AWS_REGION:ap-northeast-1}
    # LocalStack の URL。本番（AWS の S3）では空にする（S3_ENDPOINT=）。空なら AWS の S3 に、IAM ロールの権限で接続する
    endpoint: ${S3_ENDPOINT:http://localhost:4566}
    # 画像を表示するときの配信元の URL。API は「この URL + / + キー」を返す（本番は CloudFront の URL）
    image-base-url: ${IMAGE_BASE_URL:http://localhost:4566/sns-app-images}
