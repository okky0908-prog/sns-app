# ライブラリの更新 PR を Dependabot に作らせる。
# 脆弱性の修正（security updates）はこの設定と関係なく、見つかったらすぐ PR が作られる。
# 普通の更新は月1回、種類ごとに1つの PR にまとめる（PR が増えすぎないように）。
# バージョンの決め方は docs/tech-stack.md。メジャーバージョンが上がる更新は、動作確認をしてから取り込む
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    ignore:
      # Node.js は 24 系に固定している（frontend/.nvmrc）ので、型定義だけメジャーを上げない。
      # Node.js を上げるときは、この除外も外す
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]

  # API 仕様書からフロントの型を作るツール（openapi-typescript）。TypeScript 5 が前提なので、フロント本体とは分けている
  - package-ecosystem: npm
    directory: /frontend/tools/openapi-typescript
    schedule:
      interval: monthly
    ignore:
      # openapi-typescript が TypeScript 6 以降に対応したら、この除外を外す（docs/tech-stack.md）
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      openapi-typescript:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
