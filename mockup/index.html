<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNSアプリ（モック）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💬%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <p class="mock-note">※このモックはリロードすると初期データに戻ります（データはブラウザのメモリ上のみ。永続化は本実装で対応）</p>

  <!-- 共通ヘッダー（ログイン後のみ表示） -->
  <header id="app-header" class="app-header hidden">
    <div class="header-inner">
      <a href="#/" class="logo">SNSアプリ</a>
      <form id="header-search-form" class="header-search" role="search">
        <input type="search" id="header-search-input" placeholder="🔍 ユーザーを検索" maxlength="50" autocomplete="off">
      </form>
      <nav class="header-nav">
        <a href="#/" data-nav="home">ホーム</a>
        <a href="#/" id="nav-profile" data-nav="profile">プロフィール</a>
        <button type="button" id="logout-button" class="link-button">ログアウト</button>
      </nav>
    </div>
  </header>

  <!-- 各画面はscript.jsで描画 -->
  <main id="app" class="app-main"></main>

  <!-- S-04 投稿作成 / S-05 投稿編集 モーダル -->
  <div id="post-modal" class="overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="post-modal-title">
      <div class="modal-header">
        <h2 id="post-modal-title" class="modal-title">新しい投稿</h2>
        <button type="button" id="post-modal-close" class="icon-button" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <div class="compose">
          <div id="post-modal-avatar"></div>
          <div class="compose-main">
            <textarea id="post-modal-text" rows="5" placeholder="いまどうしてる？"></textarea>
            <div id="post-modal-images" class="compose-images"></div>
            <p id="post-modal-error" class="form-error"></p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <label id="post-modal-image-label" class="image-add-button">
          🖼 画像を追加
          <input type="file" id="post-modal-file" accept="image/jpeg,image/png,image/gif" multiple hidden>
        </label>
        <span class="modal-footer-right">
          <span id="post-modal-counter" class="char-counter">0 / 280</span>
          <button type="button" id="post-modal-submit" class="button primary">投稿する</button>
        </span>
      </div>
    </div>
  </div>

  <!-- 確認ダイアログ -->
  <div id="confirm-dialog" class="overlay hidden">
    <div class="modal modal-small" role="alertdialog" aria-modal="true">
      <p id="confirm-message" class="confirm-message"></p>
      <div class="confirm-buttons">
        <button type="button" id="confirm-cancel" class="button">キャンセル</button>
        <button type="button" id="confirm-ok" class="button danger">OK</button>
      </div>
    </div>
  </div>

  <!-- 画像の拡大表示 -->
  <div id="lightbox" class="overlay lightbox hidden">
    <img id="lightbox-image" alt="拡大画像">
  </div>

  <!-- 短いお知らせ -->
  <div id="toast" class="toast hidden" role="status"></div>

  <script src="script.js"></script>
</body>
</html>
