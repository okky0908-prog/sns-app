components:
  schemas:
    ApiError:
      type: object
      description: |-
        エラーレスポンスの共通形式（docs/api.md「エラーレスポンス」）。

        ```
        { "status": 400, "code": "VALIDATION_FAILED", "message": "入力内容に誤りがあります",
           "errors": [{ "field": "...", "message": "..." }] }
        ```
      properties:
        code:
          type: string
          description: |-
            エラーの種類。画面側はステータスや文言ではなく、これで見分ける

            | code | ステータス | 標準の文言 |
            |---|---|---|
            | `VALIDATION_FAILED` | 400 | 入力内容に誤りがあります |
            | `MALFORMED_REQUEST` | 400 | リクエストの形式が正しくありません |
            | `CANNOT_FOLLOW_SELF` | 400 | 自分自身はフォローできません |
            | `UNAUTHENTICATED` | 401 | ログインが必要です |
            | `INVALID_CREDENTIALS` | 401 | メールアドレスまたはパスワードが正しくありません |
            | `SESSION_EXPIRED` | 401 | ログインの有効期限が切れました。もう一度ログインしてください |
            | `FORBIDDEN` | 403 | この操作は実行できません |
            | `POST_NOT_FOUND` | 404 | この投稿は見つかりません |
            | `COMMENT_NOT_FOUND` | 404 | このコメントは見つかりません |
            | `USER_NOT_FOUND` | 404 | このアカウントは存在しません |
            | `RESOURCE_NOT_FOUND` | 404 | 指定された URL は存在しません |
            | `METHOD_NOT_ALLOWED` | 405 | この URL では、この操作はできません |
            | `ALREADY_REGISTERED` | 409 | すでに登録されています |
            | `PAYLOAD_TOO_LARGE` | 413 | 送信するデータが大きすぎます |
            | `UNSUPPORTED_MEDIA_TYPE` | 415 | リクエストの形式（Content-Type）に対応していません |
            | `INTERNAL_ERROR` | 500 | サーバーでエラーが発生しました。時間をおいてもう一度お試しください |
            | `IMAGE_UPLOAD_FAILED` | 500 | 画像のアップロードに失敗しました。時間をおいてもう一度お試しください |
            | `SERVICE_UNAVAILABLE` | 503 | ただいまサービスを利用できません。時間をおいてもう一度お試しください |
          enum:
          - VALIDATION_FAILED
          - MALFORMED_REQUEST
          - CANNOT_FOLLOW_SELF
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - SESSION_EXPIRED
          - FORBIDDEN
          - POST_NOT_FOUND
          - COMMENT_NOT_FOUND
          - USER_NOT_FOUND
          - RESOURCE_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - ALREADY_REGISTERED
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - INTERNAL_ERROR
          - IMAGE_UPLOAD_FAILED
          - SERVICE_UNAVAILABLE
        errors:
          type: array
          description: 項目ごとの入力エラー。なければ空
          items:
            $ref: "#/components/schemas/FieldError"
        message:
          type: string
          description: 利用者にそのまま見せてよい文言
        status:
          type: integer
          format: int32
      required:
      - code
      - errors
      - message
      - status
    AuthResponse:
      type: object
      description: |-
        新規登録・ログイン・再発行のレスポンス（A-01・A-02・A-04）。

        リフレッシュトークンは JavaScript から読めないよう、JSON には入れず HttpOnly Cookie で返す。
      properties:
        accessToken:
          type: string
        user:
          $ref: "#/components/schemas/UserResponse"
      required:
      - accessToken
      - user
    CommentCountResponse:
      type: object
      description: コメント削除（A-32）のレスポンス。削除後のその投稿のコメント数。
      properties:
        commentCount:
          type: integer
          format: int64
      required:
      - commentCount
    CommentRequest:
      type: object
      description: コメント投稿（A-31）のリクエスト。本文は前後の空白・改行を除いて1〜280文字（数え方は投稿と同じ）。
      properties:
        content:
          type: string
          maxLength: 280
          minLength: 1
      required:
      - content
    CommentResponse:
      type: object
      description: コメントのレスポンス（A-30 の items の各要素）。
      properties:
        author:
          $ref: "#/components/schemas/UserResponse"
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        mine:
          type: boolean
          description: ログイン中のユーザーのコメントか（画面に「削除」を出すかどうか）
      required:
      - author
      - content
      - createdAt
      - id
      - mine
    CreatedCommentResponse:
      type: object
      description: コメント投稿（A-31）のレスポンス。コメントの中身に加えて、画面でコメント数をすぐ更新できるよう投稿後のコメント数も返す。
      properties:
        author:
          $ref: "#/components/schemas/UserResponse"
        commentCount:
          type: integer
          format: int64
          description: 投稿後のその投稿のコメント数
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: integer
          format: int64
        mine:
          type: boolean
      required:
      - author
      - commentCount
      - content
      - createdAt
      - id
      - mine
    CursorPageResponseCommentResponse:
      type: object
      description: カーソル方式の一覧 API のレスポンス（docs/api.md「ページングのレスポンス」）。
      properties:
        hasNext:
          type: boolean
          description: 続きがあるか
        items:
          type: array
          description: 取得した中身（新しい順）
          items:
            $ref: "#/components/schemas/CommentResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るときに `?cursor=` に渡す値。続きがなければ null
      required:
      - hasNext
      - items
      - nextCursor
    CursorPageResponsePostResponse:
      type: object
      description: カーソル方式の一覧 API のレスポンス（docs/api.md「ページングのレスポンス」）。
      properties:
        hasNext:
          type: boolean
          description: 続きがあるか
        items:
          type: array
          description: 取得した中身（新しい順）
          items:
            $ref: "#/components/schemas/PostResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るときに `?cursor=` に渡す値。続きがなければ null
      required:
      - hasNext
      - items
      - nextCursor
    CursorPageResponseUserListItemResponse:
      type: object
      description: カーソル方式の一覧 API のレスポンス（docs/api.md「ページングのレスポンス」）。
      properties:
        hasNext:
          type: boolean
          description: 続きがあるか
        items:
          type: array
          description: 取得した中身（新しい順）
          items:
            $ref: "#/components/schemas/UserListItemResponse"
        nextCursor:
          type:
          - string
          - "null"
          description: 続きを取るときに `?cursor=` に渡す値。続きがなければ null
      required:
      - hasNext
      - items
      - nextCursor
    FieldError:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
      required:
      - field
      - message
    FollowResponse:
      type: object
      description: フォロー・フォロー解除のレスポンス（A-50・A-51）。画面は押した直後に表示を変え、この値で上書きする。
      properties:
        followerCount:
          type: integer
          format: int64
          description: 相手のフォロワー数
        following:
          type: boolean
          description: ログイン中のユーザーが相手をフォローしているか
      required:
      - followerCount
      - following
    LikeResponse:
      type: object
      description: いいね・取り消しのレスポンス（A-40・A-41）。画面は押した直後に表示を変え、この値で上書きする（その間のほかの人のいいねも反映するため）。
      properties:
        likeCount:
          type: integer
          format: int64
          description: いいね数
        likedByMe:
          type: boolean
          description: ログイン中のユーザーがいいね済みか
      required:
      - likeCount
      - likedByMe
    LoginRequest:
      type: object
      description: ログインのリクエスト（A-02）。
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    NewPostCountResponse:
      type: object
      description: 新しい投稿の件数（A-16・A-17）。PostService.NEW_COUNT_LIMIT 件で打ち切る。
      properties:
        count:
          type: integer
          format: int32
      required:
      - count
    PostImageResponse:
      type: object
      properties:
        sortOrder:
          type: integer
          format: int32
        url:
          type: string
      required:
      - sortOrder
      - url
    PostRequest:
      type: object
      description: |-
        投稿の編集（A-13）のリクエスト（JSON）。作成（A-11）は画像も送るので multipart で受け取る（PostController）。

        本文は前後の空白・改行を除いて280文字まで（絵文字も1文字と数える）。空にできるのは画像のある投稿だけ（PostService で確かめる）。
      properties:
        content:
          type: string
          maxLength: 280
    PostResponse:
      type: object
      description: |-
        投稿のレスポンス（docs/api.md「Post（投稿）」）。

        画像（images）は表示順（sortOrder 1〜4）に並ぶ。画像がなければ空。
      properties:
        author:
          $ref: "#/components/schemas/UserResponse"
        commentCount:
          type: integer
          format: int64
          description: コメント数
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type:
          - string
          - "null"
          format: date-time
          description: 本文を編集した日時。null なら未編集（画面に「編集済み」を出すかどうか）
        id:
          type: integer
          format: int64
        images:
          type: array
          items:
            $ref: "#/components/schemas/PostImageResponse"
        likeCount:
          type: integer
          format: int64
          description: いいね数
        likedByMe:
          type: boolean
          description: ログイン中のユーザーがいいね済みか（ハートの色）
        mine:
          type: boolean
          description: ログイン中のユーザーの投稿か（画面に「…」メニューを出すかどうか）
      required:
      - author
      - commentCount
      - content
      - createdAt
      - editedAt
      - id
      - images
      - likeCount
      - likedByMe
      - mine
    ProfileResponse:
      type: object
      description: プロフィールのレスポンス（A-60）。
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。設定していなければ null
        displayName:
          type: string
        followedByMe:
          type: boolean
          description: ログイン中のユーザーがこのユーザーをフォローしているか
        followerCount:
          type: integer
          format: int64
        followingCount:
          type: integer
          format: int64
        iconUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL。設定していなければ null（画面は頭文字を表示）
        id:
          type: integer
          format: int64
        me:
          type: boolean
          description: 自分のプロフィールか（「プロフィールを編集」とフォローボタンのどちらを出すか）
        username:
          type: string
      required:
      - bio
      - displayName
      - followedByMe
      - followerCount
      - followingCount
      - iconUrl
      - id
      - me
      - username
    SignupRequest:
      type: object
      description: 新規登録のリクエスト（A-01）。チェック内容とメッセージは docs/feature-specs/01_auth.md のとおり。
      properties:
        displayName:
          type: string
          maxLength: 50
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 255
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{4,15}$"
      required:
      - displayName
      - email
      - password
      - username
    UserListItemResponse:
      type: object
      description: ユーザー一覧の1行（A-52・A-53 フォロー中・フォロワー一覧、A-70 ユーザー検索で共通）。
      properties:
        bio:
          type:
          - string
          - "null"
          description: 自己紹介。設定していなければ null
        displayName:
          type: string
        followedByMe:
          type: boolean
          description: ログイン中の自分がこのユーザーをフォローしているか（一覧を見ている相手ではなく、自分から見た状態）
        iconUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL。設定していなければ null（画面は頭文字を表示）
        id:
          type: integer
          format: int64
        me:
          type: boolean
          description: 自分自身か（フォローボタンを出さない）
        username:
          type: string
      required:
      - bio
      - displayName
      - followedByMe
      - iconUrl
      - id
      - me
      - username
    UserResponse:
      type: object
      description: ログイン中のユーザーの情報（A-01〜A-03 のレスポンスの user）。投稿・コメントの投稿者（author）にも使う。
      properties:
        displayName:
          type: string
        iconUrl:
          type:
          - string
          - "null"
          description: アイコン画像の URL。設定していなければ null（画面は頭文字を表示）
        id:
          type: integer
          format: int64
        username:
          type: string
      required:
      - displayName
      - iconUrl
      - id
      - username
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: アクセストークン（有効期限15分）。期限が切れたら A-04 で再発行する
      scheme: bearer
      type: http
