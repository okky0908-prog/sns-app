openapi: 3.1.0
info:
  description: |-
    X風SNSアプリの REST API。共通のルール（日時の形式・ページング・エラーの code の使い分け）と、画面との対応は docs/api.md を参照。

    ログインが必要な API は、右上の「Authorize」にアクセストークン（ログイン・新規登録の accessToken）を入れてから試す。
  title: SNSアプリ API
  version: v1
servers:
- description: この API を動かしているサーバー
  url: /
security:
- bearerAuth: []
tags:
- name: 認証
- name: 投稿・タイムライン
- name: コメント
- name: いいね
- name: フォロー
- name: プロフィール・ユーザー検索
paths:
  /api/auth/login:
    post:
      description: A-02 ログイン。
      operationId: authLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      security: []
      summary: A-02 ログイン
      tags:
      - 認証
  /api/auth/logout:
    post:
      description: A-05 ログアウト。リフレッシュトークンを無効にし、Cookie を消す。
      operationId: authLogout
      parameters:
      - description: リフレッシュトークン（HttpOnly Cookie。なくてもエラーにしない）
        in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      security: []
      summary: A-05 ログアウト
      tags:
      - 認証
  /api/auth/me:
    get:
      description: A-03 ログイン中のユーザー情報（アクセストークンが必要）。
      operationId: authMe
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-03 ログイン中のユーザー情報（アクセストークンが必要）
      tags:
      - 認証
  /api/auth/refresh:
    post:
      description: A-04 アクセストークンの再発行。リフレッシュトークンも新しいものに交換する。
      operationId: authRefresh
      parameters:
      - description: リフレッシュトークン（HttpOnly Cookie。ログイン・新規登録のときに届き、ブラウザが自動で送る）
        in: cookie
        name: refresh_token
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      security: []
      summary: A-04 アクセストークンの再発行
      tags:
      - 認証
  /api/auth/signup:
    post:
      description: A-01 新規登録。登録後はそのままログイン状態にするため、トークンも返す。
      operationId: authSignup
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      security: []
      summary: A-01 新規登録
      tags:
      - 認証
  /api/comments/{commentId}:
    delete:
      description: A-32 コメント削除（本人だけ）。削除後のコメント数を返す。
      operationId: commentDelete
      parameters:
      - in: path
        name: commentId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCountResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-32 コメント削除（本人だけ）
      tags:
      - コメント
  /api/posts:
    post:
      description: |-
        A-11 投稿作成（multipart/form-data）。本文（content）と画像（images、4枚まで）のどちらか一方は必要。

        入力のチェックは PostService で行う（本文と画像を合わせて判定するため）。
      operationId: postCreate
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content:
                  type: string
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-11 投稿作成（multipart/form-data）
      tags:
      - 投稿・タイムライン
  /api/posts/{postId}:
    delete:
      description: A-14 投稿削除（本人だけ）。
      operationId: postDelete
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-14 投稿削除（本人だけ）
      tags:
      - 投稿・タイムライン
    get:
      description: A-12 投稿詳細。
      operationId: postGet
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-12 投稿詳細
      tags:
      - 投稿・タイムライン
    put:
      description: A-13 投稿編集（本文のみ。本人だけ）。
      operationId: postUpdate
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-13 投稿編集（本文のみ。本人だけ）
      tags:
      - 投稿・タイムライン
  /api/posts/{postId}/comments:
    get:
      description: A-30 コメント一覧（古い順）。続きは前回の nextCursor を cursor に渡す。
      operationId: commentList
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageResponseCommentResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-30 コメント一覧（古い順）
      tags:
      - コメント
    post:
      description: A-31 コメント投稿。投稿後のコメント数も返す。
      operationId: commentCreate
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedCommentResponse"
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-31 コメント投稿
      tags:
      - コメント
  /api/posts/{postId}/likes:
    delete:
      description: A-41 いいねを取り消す（いいねしていなくてもエラーにしない）。
      operationId: likeUnlike
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-41 いいねを取り消す（いいねしていなくてもエラーにしない）
      tags:
      - いいね
    post:
      description: A-40 いいねする（いいね済みでもエラーにしない）。
      operationId: likeLike
      parameters:
      - in: path
        name: postId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-40 いいねする（いいね済みでもエラーにしない）
      tags:
      - いいね
  /api/timeline:
    get:
      description: A-10 フォロー中タイムライン（自分＋フォロー中の人の投稿）。続きは前回の nextCursor を cursor に渡す。
      operationId: postFollowingTimeline
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageResponsePostResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-10 フォロー中タイムライン（自分＋フォロー中の人の投稿）
      tags:
      - 投稿・タイムライン
  /api/timeline/all:
    get:
      description: A-15 全体タイムライン（全ユーザーの投稿）。続きは前回の nextCursor を cursor に渡す。
      operationId: postAllTimeline
      parameters:
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageResponsePostResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-15 全体タイムライン（全ユーザーの投稿）
      tags:
      - 投稿・タイムライン
  /api/timeline/all/new-count:
    get:
      description: A-17 全体タイムラインの新しい投稿の件数。
      operationId: postAllNewCount
      parameters:
      - in: query
        name: since
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewPostCountResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-17 全体タイムラインの新しい投稿の件数
      tags:
      - 投稿・タイムライン
  /api/timeline/new-count:
    get:
      description: A-16 フォロー中タイムラインの新しい投稿の件数。since は画面が最後に取った一番新しい投稿の ID。
      operationId: postFollowingNewCount
      parameters:
      - in: query
        name: since
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewPostCountResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-16 フォロー中タイムラインの新しい投稿の件数
      tags:
      - 投稿・タイムライン
  /api/users/me:
    put:
      description: |-
        A-62 自分のプロフィールの編集（multipart/form-data）。表示名・自己紹介と、送ったときだけアイコン画像を差し替える。

        URL にユーザー名を入れず me にしているのは、ログイン中のユーザー以外を更新する方法をなくすため。
      operationId: userUpdate
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                bio:
                  type: string
                  description: 自己紹介（160文字まで。空でもよい）
                  maxLength: 160
                displayName:
                  type: string
                  description: 表示名（1〜50文字）
                  maxLength: 50
                  minLength: 1
                icon:
                  type: string
                  format: binary
              required:
              - displayName
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-62 自分のプロフィールの編集（multipart/form-data）
      tags:
      - プロフィール・ユーザー検索
  /api/users/search:
    get:
      description: |-
        A-70 ユーザー検索。q が空なら最近参加したユーザー。続きは前回の nextCursor を cursor に渡す。

        URL の形が A-60（/api/users/{username}）と同じだが、Spring は文字どおりの /search を優先する。 そのため search
         というユーザー名は新規登録で使えないようにしている（AuthService）。
      operationId: userSearch
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: cursor
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursorPageResponseUserListItemResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: エラー。種類はステータスや文言ではなく code で見分ける（docs/api.md「エラーレスポンス」）
      summary: A-70 ユーザー検索
      tags:
      - プロフィール・ユーザー検索
  /api/users/{username}:
    get:
      description: A-60 プロフィール。
      operationId: userProfile
      parameters:
      - in: path
        name: username
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "アクセストークンがない・無効・期限切れ（code: UNAUTHENTICATED）。A-04 で再発行して1回だけ\
            やり直す"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
